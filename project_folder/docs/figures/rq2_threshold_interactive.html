      {type:'scatter',mode:'lines',name:'95% CI',x:fit.x,y:fit.upper,line:{width:0},fill:'tonexty',fillcolor:'rgba(31,119,180,0.18)',hoverinfo:'skip',visible:tCI.checked}
    ];
    var layout={
      template:'plotly_white',title:'Threshold Effect of Conflict on Agricultural Employment',
      height:760,dragmode:'zoom',
      xaxis:{title:'Conflict intensity (events per year)',range:[0,10000],zeroline:false},
      yaxis:{title:'Agricultural employment share (%)',zeroline:false},
      legend:{orientation:'h',yanchor:'bottom',y:1.02,xanchor:'left',x:0},
      margin:{l:60,r:25,t:100,b:60},
      shapes:[{type:'line',x0:thr,x1:thr,y0:0,y1:1,xref:'x',yref:'paper',line:{color:'#d62728',width:2.5,dash:'dash'}}],
      annotations:[
        {x:thr,y:0.95,xref:'x',yref:'paper',text:'Transformation stalls above '+Math.round(thr)+' events/year',showarrow:false,font:{size:12,color:'#8b0000'},align:'left',bgcolor:'rgba(254,224,210,0.92)',bordercolor:'#d62728',borderwidth:1},
        {x:0.01,y:1.08,xref:'paper',yref:'paper',showarrow:false,align:'left',font:{size:11,color:'#374151'},bordercolor:'#9ca3af',borderwidth:1,bgcolor:'rgba(255,255,255,0.96)',text:'T-test: low-GDP mean=174.9, high-GDP mean=291.9, p<0.001. Threshold may emerge because organized violence requires minimum state capacity.'}
      ]
    };
    Plotly.react(plot,traces,layout,{responsive:true,scrollZoom:true,displaylogo:false,edits:{shapePosition:true}});
  }

  thrSlider.addEventListener('input',redraw);
  yStart.addEventListener('input',redraw);
  yEnd.addEventListener('input',redraw);
  cSel.addEventListener('change',redraw);
  tFit.addEventListener('change',redraw);
  tCI.addEventListener('change',redraw);
  tPts.addEventListener('change',redraw);
  cReset.addEventListener('click',function(){cSel.value='__all__';redraw()});
  plot.addEventListener('plotly_relayout',function(e){
    var d=e.detail||{};
    if(d.hasOwnProperty('shapes[0].x0')){
      var v=Number(d['shapes[0].x0']);
      if(isFinite(v)){thrSlider.value=Math.max(0,Math.min(10000,v)).toFixed(0);redraw()}
    }
  });
  redraw();
})();
</script></body></html>
